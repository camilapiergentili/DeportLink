spring.application.name=DeportLink
spring.docker.compose.enabled=false

# Test Database - H2 in-memory
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# JWT for testing - Must be valid base64
jwt.secret=dGVzdHNlY3JldGtleWZvciB0ZXN0aW5nYg==

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect.types.java_type_mapped_java.time.temporal.TemporalAccessor=true

# H2 specific
spring.jpa.properties.hibernate.h2.jdbc.time_zone=UTC

# Logging
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


