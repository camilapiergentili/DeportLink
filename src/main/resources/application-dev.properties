# Perfil de desarrollo local — NO es el default, se activa explícitamente
# (--spring.profiles.active=dev o SPRING_PROFILES_ACTIVE=dev).
#
# Le permite a Hibernate alterar el esquema automáticamente para poder iterar rápido sobre
# entidades sin escribir una migración de Flyway por cada cambio chico.
#
# ADVERTENCIA: ddl-auto=update nunca debe usarse fuera de desarrollo local (ver README,
# sección "Desarrollo local"). Fuera de tu máquina el esquema lo controla exclusivamente
# Flyway con ddl-auto=validate (el default de application.properties).
spring.jpa.hibernate.ddl-auto=update
