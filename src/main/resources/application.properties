spring.application.name=DeportLink

# Orígenes permitidos para CORS — sin default hardcodeado a propósito. Si CORS_ALLOWED_ORIGINS
# no está seteada, esto resuelve a un string vacío (":" sin valor) en vez de fallar al resolver
# el placeholder o colar un valor de desarrollo; SecurityConfig.validateCorsAllowedOrigins()
# rechaza el arranque con un mensaje claro en ese caso, en lugar de levantar la app silenciosa.
# En desarrollo local, ver application-dev.properties (perfil "dev").
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

spring.docker.compose.enabled=false

# Configuracion de la base de datos MySQL (usando variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration=36000000



spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Flyway es la unica fuente de verdad para el esquema; Hibernate solo valida:
spring.jpa.hibernate.ddl-auto=validate

# Flyway — baseline sobre schema existente (tablas ya creadas por Hibernate)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
