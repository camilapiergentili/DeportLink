spring.application.name=DeportLink
cors.allowed-origins=http://localhost:5173
spring.docker.compose.enabled=false

# Configuracion de la base de datos MySQL (usando variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration=36000000



spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Flyway es la unica fuente de verdad para el esquema; Hibernate solo valida:
spring.jpa.hibernate.ddl-auto=validate

# Flyway — baseline sobre schema existente (tablas ya creadas por Hibernate)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
